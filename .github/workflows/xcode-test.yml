name: Xcode - Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Test schemes using xcodebuild command
    runs-on: macos-15
    strategy:
        matrix:
          scheme: ["Harmony"]
          destination: ['platform=macOS', 'platform=iOS Simulator,OS=18.5,name=iPhone 16 Pro']
    
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: List Xcode installations
        run: sudo ls -1 /Applications | grep "Xcode"
      - name: Select Xcode 16.4
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version
          xcrun swift --version
      - name: Build and test
        shell: bash
        env:
          scheme: ${{ matrix.scheme }}
          destination: ${{ matrix.destination }}
        run: |
          if [[ "${destination}" == "platform=macOS" ]]; then
            destination="${destination},arch=$(uname -m)"
          fi
          # Keep entitlements while signing locally without a development certificate.
          xcodebuild clean test \
            -project Harmony.xcodeproj \
            -scheme "${scheme}" \
            -destination "${destination}" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            | xcpretty
        
